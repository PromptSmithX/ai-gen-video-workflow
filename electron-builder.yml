appId: com.company.podvideostudio
productName: POD Video Studio
directories:
  output: release
files:
  - "out/**"
extraResources:
  - from: "prompts"
    to: "prompts"
  - from: "vendor/muse4ai/dist"
    to: "muse4ai"
  # Calendar artwork compositor sidecar (built by `npm run build:compositor`; see ADR-004)
  - from: "vendor/calendar-compositor/dist/calendar-compositor"
    to: "calendar-compositor"
asar: true
publish: null
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
